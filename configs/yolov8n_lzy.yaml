# Improved YOLOv8n (GitHub LZY-233 variant) for steel surface defect detection.
#
# Reproduces the architecture of:
#   LZY-233/yolov8_Imporved-Defect_detection
#   (GhostConv backbone + ResBlock_CBAM in the head + WIoU loss; reported
#    mAP@0.5 = 0.792 on NEU-DET).
#
# Modifications vs. baseline YOLOv8n (see docs/lzy_model_notes.md):
#   1. GhostConv : the three stride-2 DOWNSAMPLE convs (P3/P4/P5) -> GhostConv.
#                  (Lighter touch than the paper's full Ghost backbone — C2f blocks
#                   are kept standard, which is why this model is heavier: ~4.05M.)
#   2. ResBlock_CBAM : inserted after EACH of the four neck C2f blocks; Detect reads
#                      the three CBAM outputs (P3/P4/P5).  (src/modules/rescbam.py)
#   3. WIoU loss : replaces CIoU (applied in code via src.modules.register_lzy).
#
# NOTE: requires src.modules.register_lzy() to have run, otherwise the
# `ResBlock_CBAM` layer name is unknown to ultralytics' model parser.

# Parameters
nc: 6 # number of classes (NEU-DET steel defects)
scales: # 'n' auto-selected from the filename "yolov8n..."
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# ---- Backbone: GhostConv on the 3 downsample convs only (modification #1) -----
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2  (stem)
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, GhostConv, [256, 3, 2]] # 3-P3/8     (Ghost)
  - [-1, 6, C2f, [256, True]] # 4   <- P3 (to neck)
  - [-1, 1, GhostConv, [512, 3, 2]] # 5-P4/16    (Ghost)
  - [-1, 6, C2f, [512, True]] # 6   <- P4 (to neck)
  - [-1, 1, GhostConv, [1024, 3, 2]] # 7-P5/32   (Ghost)
  - [-1, 3, C2f, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9   <- P5

# ---- Head: PAN-FPN with ResBlock_CBAM after each C2f (modification #2) --------
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], 1, Concat, [1]] # 11  cat backbone P4
  - [-1, 3, C2f, [512]] # 12
  - [-1, 1, ResBlock_CBAM, []] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15  cat backbone P3
  - [-1, 3, C2f, [256]] # 16
  - [-1, 1, ResBlock_CBAM, []] # 17 (P3/8-small)  -> Detect

  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 12], 1, Concat, [1]] # 19  cat head P4 (pre-CBAM C2f, layer 12)
  - [-1, 3, C2f, [512]] # 20
  - [-1, 1, ResBlock_CBAM, []] # 21 (P4/16-medium) -> Detect

  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 9], 1, Concat, [1]] # 23  cat backbone P5 (SPPF, layer 9)
  - [-1, 3, C2f, [1024]] # 24
  - [-1, 1, ResBlock_CBAM, []] # 25 (P5/32-large) -> Detect

  - [[17, 21, 25], 1, Detect, [nc]] # 26  Detect(P3, P4, P5)
