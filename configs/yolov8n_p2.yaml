# YOLOv8n + P2 detection head - small-object arm for NEU-DET (roadmap item #3).
#
# Adds a stride-4 (P2) detection head on top of the standard P3/P4/P5. Targets the
# measured weakness: `inclusion` (median box 4% of frame) and thin `scratches`, plus the
# 13x object-scale range (DATA_AUDIT.md). Stock Ultralytics modules only - NO register().
#
# Train via scripts/run_seed_study.py:
#   python scripts/run_seed_study.py --train --tag baseline_p2_640 \
#       --model configs/yolov8n_p2.yaml --imgsz 640 --epochs 150
# (the script calls .load('yolov8n.pt') to transfer compatible COCO weights)

nc: 6  # crazing, inclusion, patches, pitted_surface, rolled-in_scale, scratches

scales:  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]   # 1-P2/4
  - [-1, 3, C2f, [128, True]]    # 2
  - [-1, 1, Conv, [256, 3, 2]]   # 3-P3/8
  - [-1, 6, C2f, [256, True]]    # 4
  - [-1, 1, Conv, [512, 3, 2]]   # 5-P4/16
  - [-1, 6, C2f, [512, True]]    # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f, [1024, True]]   # 8
  - [-1, 1, SPPF, [1024, 5]]     # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]    # cat backbone P4
  - [-1, 3, C2f, [512]]          # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]    # cat backbone P3
  - [-1, 3, C2f, [256]]          # 15 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]    # cat backbone P2
  - [-1, 3, C2f, [128]]          # 18 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]   # cat head P3
  - [-1, 3, C2f, [256]]          # 21 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]   # cat head P4
  - [-1, 3, C2f, [512]]          # 24 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]    # cat head P5
  - [-1, 3, C2f, [1024]]         # 27 (P5/32-large)

  - [[18, 21, 24, 27], 1, Detect, [nc]]  # Detect(P2, P3, P4, P5)
