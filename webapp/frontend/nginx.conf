server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # API + auth + uploaded media -> backend service (same-origin, no CORS needed)
    location /api/   { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /auth/  { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /media/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location = /health { proxy_pass http://backend:8000/health; }

    # SPA: serve static assets, fall back to index.html for client-side routes
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
